# openGym Linux 部署(tailnet-only)
# - 独立本地 image tag(opengym-api:linux / opengym-web:linux),`docker compose pull`
#   不会把服务换回上游 ghcr 镜像
# - 持久化在宿主 /data/opengym(与其它自托管服务并列,可整目录备份);
#   绝不指向 Glass / OpenClaw 的任何目录
# - web 只绑宿主回环(WEB_PORT=127.0.0.1:18880),对外入口由 tailscale serve
#   提供 HTTPS(不开 Funnel);API 不直接发布端口,仅经 web nginx 代理
# 启动:cd deploy/linux && docker compose up -d --build
name: opengym

services:
  api:
    image: opengym-api:linux
    # 以宿主 uid 运行:数据文件归 wuzi,宿主侧 MCP 才能只读访问;也避免容器 root 写宿主盘
    user: "1000:1000"
    build:
      context: ../../api
      target: ${API_TARGET:-default}
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - TRUST_PROXY=1
    volumes:
      - /data/opengym/data:/data
      - /data/opengym/coach-auth:/coach-auth

  web:
    image: opengym-web:linux
    build:
      context: ../..
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-127.0.0.1:18880}:80"
    environment:
      - NGINX_PORT=80
      - BACKEND=api
      - PORT=3000
      - MEDIA_UPLOAD_MAX=48m
